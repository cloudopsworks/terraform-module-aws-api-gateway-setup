# Terragrunt Boilerplate Configuration
variables:
  # Generic Boilerplate Variables Setup
  - name: is_hub
    order: 0
    description: "Is this a hub configuration?"
    type: bool
    default: false
  - name: tags
    order: 1
    description: "Tags"
    type: map
    default: {}
  # End - Generic Boilerplate Variables Setup
  - name: acm_enabled
    order: 2
    description: "Enable ACM module dependency"
    type: bool
    default: false
  - name: acm_path
    order: 3
    description: "Path to ACM module dependency"
    type: string
    default: "../acm"
  - name: vpc_link_enabled
    order: 4
    description: "Enable VPC Link module dependency (NLB)"
    type: bool
    default: false
  - name: vpc_link_path
    order: 5
    description: "Path to VPC Link module dependency"
    type: string
    default: "../vpc-link"

hooks:
  after:
    - command: "git"
      args: ["add", "."]
      dir: "{{ outputFolder }}"